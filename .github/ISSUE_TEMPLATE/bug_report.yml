name: Bug Report
description: Report a reproducible problem with Arma 3 Command
title: "[BUG] "

body:
  - type: markdown
    attributes:
      value: |
        # Arma 3 Command Bug Report

        Please use this form for **bugs and unintended behavior only**.

        The most useful bug reports are issues that can be reproduced consistently. Before reporting, please try to determine whether the issue also occurs with **only Arma 3 Command and CBA_A3 loaded**.

        Feature requests will have a separate form.

  # ---------------------------------------------------------------------------
  # REPORTER / VERSION
  # ---------------------------------------------------------------------------

  - type: input
    id: reporter
    attributes:
      label: Discord Username / Preferred Contact Name
      description: |
        Optional. If you are a member of the A3C Discord, you can enter your Discord username here so I can identify or contact you there.
      placeholder: "Optional"

  - type: dropdown
    id: arma_branch
    attributes:
      label: Arma 3 Version
      description: Which Arma 3 branch/version are you using?
      options:
        - Current Release
        - Development Branch
        - Legacy Version
    validations:
      required: true

  - type: input
    id: arma_legacy_version
    attributes:
      label: Legacy Arma 3 Version
      description: |
        Only fill this out if you selected "Legacy Version" above.
        Legacy Arma 3 versions are not officially supported, but this information may still help identify the issue.
      placeholder: "Leave blank unless using a legacy version"

  - type: input
    id: a3c_version
    attributes:
      label: A3C Version
      description: |
        The current public release is entered automatically.
        Change this only if you are using a different A3C version or development build.
      value: "1.0.0.03.1"

  # ---------------------------------------------------------------------------
  # ENVIRONMENT
  # ---------------------------------------------------------------------------

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: In which environment did you reproduce the issue?
      options:
        - Singleplayer
        - Hosted Multiplayer
        - Dedicated Server
    validations:
      required: true

  - type: dropdown
    id: command_scope
    attributes:
      label: Where does the issue occur?
      description: Select the command context in which you can reproduce the problem.
      options:
        - Squad Command
        - High Command
        - Both Squad and High Command
        - General / UI / not tied to a command level
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How consistently does the issue occur?
      options:
        - Every time
        - Most of the time
        - Sometimes
        - Happened once
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # ADDON ISOLATION
  # ---------------------------------------------------------------------------

  - type: dropdown
    id: clean_test
    attributes:
      label: A3C + CBA_A3 Only Test
      description: |
        Have you tested whether the problem occurs with only Arma 3 Command and CBA_A3 loaded?

        This is important because it distinguishes an A3C bug from a conflict with another addon.
      options:
        - Yes - the issue occurs with only A3C + CBA_A3
        - No - I have not tested with only A3C + CBA_A3
        - No - the issue disappears when only A3C + CBA_A3 are loaded
    validations:
      required: true

  - type: textarea
    id: other_addons
    attributes:
      label: Other Addons Used
      description: |
        List the other addons that were active when the problem occurred.

        If you reproduced the issue with only A3C + CBA_A3, leave "None".
      value: "None"
      placeholder: |
        Example:
        ACE3
        RHSUSAF
        LAMBS_Danger.fsm
    validations:
      required: true

  - type: input
    id: suspected_conflict
    attributes:
      label: Suspected Conflicting Addon
      description: |
        If the issue disappears when testing with only A3C + CBA_A3, enter the addon you believe causes the conflict if you have identified it.
      placeholder: "Optional"

  # ---------------------------------------------------------------------------
  # BUG DESCRIPTION
  # ---------------------------------------------------------------------------

  - type: textarea
    id: description
    attributes:
      label: What is the problem?
      description: |
        Describe what you were trying to do and what went wrong.

        Please describe unintended behavior here rather than requesting different or additional functionality.
      placeholder: |
        Describe the problem clearly enough that someone unfamiliar with your mission can understand what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Describe the exact steps needed to reproduce the problem.
        Please start from a state that another user could reasonably recreate.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: "Describe the behavior you expected."
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # DIAGNOSTICS / MEDIA
  # ---------------------------------------------------------------------------

  - type: textarea
    id: rpt
    attributes:
      label: RPT / Script Errors
      description: |
        Paste any relevant RPT entries, script errors, or other diagnostic output here.
        Leave this blank if you did not observe any relevant errors.
      render: text

  - type: textarea
    id: media
    attributes:
      label: Screenshots / Video / Additional Files
      description: |
        Screenshots and videos are strongly encouraged when they help demonstrate the problem.

        Please use common and trusted hosting platforms such as YouTube, Medal.tv, Imgur, or direct GitHub attachments. Links to unknown or suspicious file-hosting services may be ignored for security reasons.
      placeholder: "Optional additional evidence or information"

  # ---------------------------------------------------------------------------
  # FINAL CHECK
  # ---------------------------------------------------------------------------

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before Submitting
      options:
        - label: I have searched existing issues to check whether this problem has already been reported.
          required: true
        - label: I have provided enough information and reproduction steps to investigate this issue.
          required: true